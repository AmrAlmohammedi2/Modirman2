name: Build ManagerMan APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: 'true'

      - name: Install Android SDK platform and build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find or extract the Android project
        shell: bash
        run: |
          set -euo pipefail

          find_project() {
            local search_root="$1"
            while IFS= read -r -d '' settings_file; do
              local candidate
              candidate="$(dirname "$settings_file")"

              if [[ -f "$candidate/app/build.gradle.kts" || -f "$candidate/app/build.gradle" ]] \
                 && [[ -f "$candidate/app/src/main/AndroidManifest.xml" ]]; then
                realpath "$candidate"
                return 0
              fi
            done < <(
              find "$search_root" \
                -type d \( -name .git -o -name .gradle -o -name build \) -prune -o \
                -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print0
            )
            return 1
          }

          PROJECT_DIR=""

          # First search all folders in the checked-out repository.
          if PROJECT_DIR="$(find_project "$GITHUB_WORKSPACE")"; then
            echo "Found Android project at: $PROJECT_DIR"
          else
            echo "No extracted Gradle project found. Searching for a ManagerMan source ZIP..."

            EXTRACT_DIR="$RUNNER_TEMP/managerman-source"
            mkdir -p "$EXTRACT_DIR"
            ZIP_FOUND="false"

            while IFS= read -r -d '' archive; do
              ZIP_FOUND="true"
              destination="$EXTRACT_DIR/$(basename "${archive%.zip}")"
              mkdir -p "$destination"
              echo "Extracting: $archive"
              unzip -oq "$archive" -d "$destination"
            done < <(
              find "$GITHUB_WORKSPACE" -maxdepth 5 -type f \
                \( -iname 'ManagerMan*.zip' -o -iname '*ManagerMan*Source*.zip' \) -print0
            )

            if [[ "$ZIP_FOUND" == "true" ]]; then
              if PROJECT_DIR="$(find_project "$EXTRACT_DIR")"; then
                echo "Found Android project inside source archive at: $PROJECT_DIR"
              fi
            fi
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::Android project not found. Extract the ManagerMan source ZIP into the repository, or commit the ZIP using a filename beginning with ManagerMan."
            echo "Repository files (first four levels):"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          echo "Building project from: $PROJECT_DIR"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          if [[ ! -f "$PROJECT_DIR/settings.gradle.kts" && ! -f "$PROJECT_DIR/settings.gradle" ]]; then
            echo "::error::Gradle settings file missing from $PROJECT_DIR"
            exit 1
          fi

      - name: Build Debug APK
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ManagerMan-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
